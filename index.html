<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر شعر سینا عباسی</title>
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="style.css">
    <!-- فونت وزیرمتن برای زیبایی متن‌های فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <h1>دفتر شعر سینا عباسی</h1>
            <p>نجوای واژه‌ها و طنین احساس در اوراق خیال</p>
        </div>
    </header>

    <main class="main-container">
        <!-- بخش جستجو و فیلترها -->
        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="جستجو در واژه‌ها، بیت‌ها یا عنوان غزل...">
            </div>
        </section>

        <!-- لیست غزل‌ها -->
        <section class="poems-grid" id="poemsGrid">
            <!-- کارت‌های غزل به صورت دینامیک از فایل poems.js لود می‌شوند -->
        </section>

        <!-- دکمه مشاهده بیشتر -->
        <div class="load-more-container">
            <button id="loadMoreBtn" class="load-more-btn">نمایش غزل‌های بیشتر</button>
        </div>
    </main>

    <!-- مودال (پنجره بازشو) برای خواندن کامل غزل -->
    <div id="poemModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- محتوای غزل انتخاب شده اینجا قرار می‌گیرد -->
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>تمامی حقوق محفوظ است | ساخته شده با عشق و واژه</p>
    </footer>

    <!-- اسکریپت‌ها -->
    <script src="poems.js"></script>
    <script src="script.js"></script>
</body>
</html>
